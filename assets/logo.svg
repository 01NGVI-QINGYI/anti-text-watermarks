<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">anti-text-watermarks — abstract Wen mark</title>
  <desc id="desc">A clearly legible four-stroke Chinese character 文 in a cyan-violet cyber shield, rendered entirely as vector paths.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1222"/><stop offset="100%" stop-color="#101b32"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/><stop offset="52%" stop-color="#4f9cf8"/><stop offset="100%" stop-color="#b67af7"/>
    </linearGradient>
    <linearGradient id="glyph" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b8f7ff"/><stop offset="55%" stop-color="#5be2f0"/><stop offset="100%" stop-color="#a9a2ff"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#background)"/>
  <!-- Precisely symmetric shield, centered at x=256 -->
  <path d="M256 64 L405 124 V244 C405 338 341 402 256 446 C171 402 107 338 107 244 V124 Z"
        fill="#101c30" stroke="url(#shield)" stroke-width="14" stroke-linejoin="round"/>
  <!-- Recognizable four-stroke 文: slanted dot, long horizontal, left and right sweeping strokes. -->
  <g fill="none" stroke="url(#glyph)" stroke-linecap="round" stroke-linejoin="round">
    <!-- 丨: short vertical top stroke -->
    <path d="M256 150 V177" stroke-width="21"/>
    <!-- 一: horizontal stroke -->
    <path d="M171 215 Q256 210 341 215" stroke-width="20"/>
    <!-- 丿: sweeping down-left, beginning beneath the horizontal -->
    <path d="M306 244 Q283 299 251 329 Q221 357 185 371" stroke-width="22"/>
    <!-- ㇏: sweeping down-right, crossing the left-falling stroke -->
    <path d="M207 244 Q227 293 262 324 Q294 356 327 371" stroke-width="22"/>
  </g>
</svg>
