<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">anti-text-watermarks — abstract Wen mark</title>
  <desc id="desc">A clearly legible four-stroke Chinese character 文 in a cyan-violet cyber shield, rendered entirely as vector paths.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1222"/><stop offset="100%" stop-color="#101b32"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/><stop offset="52%" stop-color="#4f9cf8"/><stop offset="100%" stop-color="#b67af7"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#background)"/>
  <!-- Precisely symmetric shield, centered at x=256 -->
  <path d="M256 64 L405 124 V244 C405 338 341 402 256 446 C171 402 107 338 107 244 V124 Z"
        fill="#101c30" stroke="url(#shield)" stroke-width="14" stroke-linejoin="round"/>
  <!-- 文: centered at x=256, with perfectly mirrored left/right geometry and solid fill. -->
  <g fill="none" stroke="#eafaff" stroke-linecap="round" stroke-linejoin="round">
    <!-- Clearly visible short vertical top stroke -->
    <path d="M256 143 V184" stroke-width="22"/>
    <!-- Centered horizontal stroke -->
    <path d="M178 219 H334" stroke-width="21"/>
    <!-- Mirrored descending sweeps, crossing at the exact center -->
    <path d="M208 249 Q227 302 256 326 Q277 348 316 365" stroke-width="22"/>
    <path d="M304 249 Q285 302 256 326 Q235 348 196 365" stroke-width="22"/>
  </g>
</svg>
