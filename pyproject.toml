[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "anti-text-watermarks"
version = "1.0.0"
description = "Comprehensive adversarial toolkit against statistical LLM text watermarks (OpenAI textGrain, Google SynthID-Text, Kirchenbauer Red-Green) and steganographic Unicode markers."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "AGPL-3.0-or-later"}
authors = [
    {name = "01NGVI-QINGYI"}
]
keywords = [
    "watermark",
    "textGrain",
    "SynthID",
    "LLM",
    "paraphrase",
    "DIPPER",
    "MarkLLM",
    "NLP",
    "privacy"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/01NGVI-QINGYI/anti-text-watermarks"
Repository = "https://github.com/01NGVI-QINGYI/anti-text-watermarks"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
anti-text-watermarks = "anti_text_watermarks.cli:main"
atw = "anti_text_watermarks.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["anti_text_watermarks*"]

[tool.setuptools.package-data]
"anti_text_watermarks.web" = ["static/*"]
